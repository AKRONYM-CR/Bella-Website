<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8f2ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .coming-soon {
            padding: 2rem;
            animation: fadeIn 1.5s ease-out;
        }
        .logo {
            font-size: 3.5rem;
            font-weight: 600;
            color: #1A1A1A;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 1.5rem;
            color: #666;
            font-weight: 300;
            margin-top: 0.5rem;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="coming-soon">
        <div class="logo">BELLA</div>
        <div class="subtitle">Coming Soon</div>
    </div>

    <!-- <div 
        data-tf-widget="YOUR_TYPEFORM_ID"

        data-tf-hidden="utm_source=xxxxx,utm_medium=xxxxx"
        id="typeform-embed"
    ></div>
    <script src="//embed.typeform.com/next/embed.js"></script> -->
</body>
</html>
